{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}EventBook{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}" />
    <link rel="icon" type="image/png" href="{% static 'homepage/img/logo.png' %}" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    {% include "includes/header.html" %}
    <main class="flex-grow-1">{% block content %} {% endblock %}</main>
    <footer>
      <p>© <span id="current-year"></span> EventBook</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
  </body>
</html>
